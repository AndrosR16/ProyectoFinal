<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">


<head>

    <meta charset="UTF-8">

    <title>Factura</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>



<body>


<div class="container mt-4">


    <h1 class="mb-4"
        th:text="${factura.id == null ? 'Nueva factura' : 'Editar factura'}">

        Factura

    </h1>





    <!-- Mensaje error del servicio -->

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>





    <form th:action="@{/facturas}"
          th:object="${factura}"
          method="post">



        <!-- ID oculto para edición -->

        <input type="hidden"
               th:field="*{id}">






        <!-- Cliente -->

        <div class="mb-3">


            <label class="form-label">

                Cliente

            </label>




            <select class="form-select"
                    th:field="*{cliente.id}">


                <option value="">
                    Seleccione cliente
                </option>




                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre}">
                </option>



            </select>




            <div class="text-danger"
                 th:errors="*{cliente}">
            </div>


        </div>








        <!-- Medicamento -->


        <div class="mb-3">


            <label class="form-label">

                Medicamento

            </label>




            <select class="form-select"
                    th:field="*{medicamentoId}">


                <option value="">
                    Seleccione medicamento
                </option>





                <option th:each="medicamento : ${medicamentos}"
                        th:value="${medicamento.id}"
                        th:text="${medicamento.nombre}">
                </option>



            </select>



            <div class="text-danger"
                 th:errors="*{medicamentoId}">
            </div>


        </div>








        <!-- Cantidad -->


        <div class="mb-3">


            <label class="form-label">

                Cantidad

            </label>



            <input type="number"
                   class="form-control"
                   min="1"
                   th:field="*{cantidad}">



            <div class="text-danger"
                 th:errors="*{cantidad}">
            </div>


        </div>








        <button type="submit"
                class="btn btn-success">

            Guardar

        </button>




        <a class="btn btn-secondary"
           th:href="@{/facturas}">

            Cancelar

        </a>




    </form>



</div>



</body>


</html>
