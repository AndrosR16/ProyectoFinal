# Perfil de produccion (activar con SPRING_PROFILES_ACTIVE=prod).
#
# La URL y credenciales del datasource NO se definen aqui: se inyectan por
# variables de entorno (SPRING_DATASOURCE_URL, DB_USERNAME, DB_PASSWORD),
# tal como ya espera src/main/resources/application.properties.

# La plataforma (Railway, Render, etc.) suele inyectar PORT; si no existe,
# se usa 8080 por defecto.
server.port=${PORT:8080}

# En produccion no interesa recompilar plantillas en cada request.
spring.thymeleaf.cache=true

# Sin SQL crudo en logs de produccion.
spring.jpa.show-sql=false

# Crea/actualiza el esquema automaticamente en el primer arranque.
spring.jpa.hibernate.ddl-auto=update

# IMPORTANTE: en produccion se DEBEN definir SEED_ADMIN_PASSWORD y
# SEED_EMPLEADO_PASSWORD con contraseñas fuertes antes del primer arranque
# (primera siembra contra una base vacia). Sin default debil aqui a proposito:
# si la variable no esta definida, la propiedad queda vacia; DataSeeder detecta
# el valor en blanco, cae al valor de desarrollo y registra un warning (nunca
# cifra una contraseña vacia).
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.empleado-password=${SEED_EMPLEADO_PASSWORD:}
