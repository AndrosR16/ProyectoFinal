<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{perfil.titulo.pagina}">Mi perfil - Farmacia</title>

    <link th:replace="~{fragments/head :: bootstrap-css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <section class="encabezado-pagina mb-4">

                <span class="insignia-proveedor mb-2" th:text="#{perfil.insignia}">
                    Configuración de cuenta
                </span>

                <h1 th:text="#{perfil.titulo}">
                    Mi perfil
                </h1>

                <p th:text="#{perfil.subtitulo}">
                    Actualice sus datos personales y contraseña de acceso.
                </p>

            </section>

            <div class="alert alert-success"
                 th:if="${ok}"
                 th:text="${ok}">
            </div>

            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <section class="card formulario-farmacia mb-4">

                <div class="card-body">

                    <h2 class="card-title mb-4" th:text="#{perfil.datos.titulo}">
                        Datos personales
                    </h2>

                    <form th:object="${perfilForm}"
                          th:action="@{/perfil}"
                          method="post">

                        <div class="mb-4">

                            <label for="username" class="form-label" th:text="#{comun.campo.usuario}">
                                Usuario
                            </label>

                            <input type="text"
                                   id="username"
                                   class="form-control"
                                   th:value="${username}"
                                   disabled
                                   readonly>

                            <div class="form-text" th:text="#{perfil.campo.username.ayuda}">
                                El nombre de usuario no se puede modificar.
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="nombre" class="form-label" th:text="#{comun.campo.nombre.completo}">
                                Nombre completo
                            </label>

                            <input type="text"
                                   id="nombre"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')}
                                       ? 'is-invalid'"
                                   th:field="*{nombre}"
                                   placeholder="Ingrese su nombre completo"
                                   th:placeholder="#{registro.placeholder.nombre}">

                            <div class="invalid-feedback"
                                 th:errors="*{nombre}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="correo" class="form-label" th:text="#{comun.campo.correo}">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   id="correo"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('correo')}
                                       ? 'is-invalid'"
                                   th:field="*{correo}"
                                   placeholder="Ejemplo: correo@dominio.com"
                                   th:placeholder="#{registro.placeholder.correo}">

                            <div class="invalid-feedback"
                                 th:errors="*{correo}">
                            </div>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button type="submit"
                                    class="btn btn-farmacia"
                                    th:text="#{comun.guardar.cambios}">
                                Guardar cambios
                            </button>

                        </div>

                    </form>

                </div>

            </section>

            <section class="card formulario-farmacia">

                <div class="card-body">

                    <h2 class="card-title mb-4" th:text="#{perfil.password.titulo}">
                        Cambiar contraseña
                    </h2>

                    <form th:object="${cambioPasswordForm}"
                          th:action="@{/perfil/password}"
                          method="post">

                        <div class="mb-4">

                            <label for="passwordActual" class="form-label" th:text="#{perfil.campo.password.actual}">
                                Contraseña actual
                            </label>

                            <input type="password"
                                   id="passwordActual"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('passwordActual')}
                                       ? 'is-invalid'"
                                   th:field="*{passwordActual}"
                                   placeholder="Ingrese su contraseña actual"
                                   th:placeholder="#{perfil.placeholder.password.actual}">

                            <div class="invalid-feedback"
                                 th:errors="*{passwordActual}">
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label for="passwordNueva" class="form-label" th:text="#{perfil.campo.password.nueva}">
                                    Contraseña nueva
                                </label>

                                <input type="password"
                                       id="passwordNueva"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('passwordNueva')}
                                           ? 'is-invalid'"
                                       th:field="*{passwordNueva}"
                                       placeholder="Ingrese una nueva contraseña"
                                       th:placeholder="#{perfil.placeholder.password.nueva}">

                                <div class="invalid-feedback"
                                     th:errors="*{passwordNueva}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-4">

                                <label for="confirmarPassword" class="form-label" th:text="#{perfil.campo.confirmar.password.nueva}">
                                    Confirmar contraseña nueva
                                </label>

                                <input type="password"
                                       id="confirmarPassword"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('confirmarPassword')}
                                           ? 'is-invalid'"
                                       th:field="*{confirmarPassword}"
                                       placeholder="Repita la nueva contraseña"
                                       th:placeholder="#{perfil.placeholder.confirmar.password.nueva}">

                                <div class="invalid-feedback"
                                     th:errors="*{confirmarPassword}">
                                </div>

                            </div>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button type="submit"
                                    class="btn btn-farmacia"
                                    th:text="#{comun.guardar.cambios}">
                                Guardar cambios
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>
</html>
