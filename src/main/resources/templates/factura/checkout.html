<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{factura.titulo.pagina}">Facturas - Farmacia</title>

    <link th:replace="~{fragments/head :: bootstrap-css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <section class="encabezado-pagina mb-4">

        <span class="insignia-proveedor mb-2"
              th:text="#{factura.checkout.insignia}">
            Cierre de compra
        </span>

        <h1 th:text="#{factura.checkout.titulo}">Generar factura</h1>

        <p th:text="#{factura.checkout.subtitulo}">
            Complete los datos del comprador para emitir la factura.
        </p>

    </section>

    <div class="row g-4">

        <div class="col-lg-7">

            <section class="card formulario-farmacia h-100">

                <div class="card-body">

                    <h5 class="card-title mb-4"
                        th:text="#{factura.comprador.titulo}">
                        Datos del comprador
                    </h5>

                    <form th:object="${facturaForm}"
                          th:action="@{/facturas}"
                          method="post"
                          class="js-compra-form">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-4">

                            <label for="compradorNombre" class="form-label"
                                   th:text="#{factura.campo.nombre}">
                                Nombre completo
                            </label>

                            <input type="text"
                                   id="compradorNombre"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('compradorNombre')}
                                       ? 'is-invalid'"
                                   th:field="*{compradorNombre}"
                                   th:placeholder="#{factura.placeholder.nombre}"
                                   required>

                            <div class="invalid-feedback"
                                 th:errors="*{compradorNombre}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="compradorIdentificacion" class="form-label"
                                   th:text="#{factura.campo.identificacion}">
                                Identificación
                            </label>

                            <input type="text"
                                   id="compradorIdentificacion"
                                   class="form-control js-cedula"
                                   inputmode="numeric"
                                   maxlength="11"
                                   th:classappend="${#fields.hasErrors('compradorIdentificacion')}
                                       ? 'is-invalid'"
                                   th:field="*{compradorIdentificacion}"
                                   placeholder="0-0000-0000"
                                   required>

                            <div class="form-text" th:text="#{factura.cedula.ayuda}">
                                Formato: 0-0000-0000
                            </div>

                            <div class="invalid-feedback"
                                 th:errors="*{compradorIdentificacion}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="compradorCorreo" class="form-label"
                                   th:text="#{factura.campo.correo}">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   id="compradorCorreo"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('compradorCorreo')}
                                       ? 'is-invalid'"
                                   th:field="*{compradorCorreo}"
                                   th:placeholder="#{factura.placeholder.correo}">

                            <div class="invalid-feedback"
                                 th:errors="*{compradorCorreo}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="compradorTelefono" class="form-label"
                                   th:text="#{factura.campo.telefono}">
                                Teléfono
                            </label>

                            <div class="input-group tel-cr-grupo">

                                <span class="input-group-text tel-cr-prefijo"
                                      th:aria-label="#{telefono.pais.aria}">
                                    <svg class="tel-cr-bandera"
                                         viewBox="0 0 20 14"
                                         width="18"
                                         height="13"
                                         role="img"
                                         aria-hidden="true"
                                         focusable="false">
                                        <rect x="0" y="0" width="20" height="14" fill="#002B7F"></rect>
                                        <rect x="0" y="2.333" width="20" height="9.334" fill="#ffffff"></rect>
                                        <rect x="0" y="4.667" width="20" height="4.666" fill="#CE1126"></rect>
                                    </svg>
                                    <span>+506</span>
                                </span>

                                <input type="tel"
                                       id="compradorTelefono"
                                       class="form-control js-telefono"
                                       inputmode="numeric"
                                       autocomplete="tel-national"
                                       maxlength="9"
                                       th:classappend="${#fields.hasErrors('compradorTelefono')} ? 'is-invalid'"
                                       th:field="*{compradorTelefono}"
                                       th:placeholder="#{factura.placeholder.telefono}">

                                <div class="invalid-feedback"
                                     th:errors="*{compradorTelefono}">
                                </div>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label"
                                   th:text="#{factura.pago.titulo}">
                                Método de pago
                            </label>

                            <div class="metodo-pago">

                                <label class="metodo-pago-opcion">
                                    <input type="radio" th:field="*{metodoPago}" value="EFECTIVO">
                                    <span th:text="#{factura.pago.efectivo}">Efectivo (retiro en tienda)</span>
                                </label>

                                <label class="metodo-pago-opcion">
                                    <input type="radio" th:field="*{metodoPago}" value="SINPE">
                                    <span th:text="#{factura.pago.sinpe}">SINPE Móvil (retiro en tienda)</span>
                                </label>

                            </div>

                            <div class="metodo-pago-info"
                                 th:classappend="${facturaForm.metodoPago == 'SINPE'} ? '' : 'd-none'"
                                 th:text="#{factura.pago.sinpe.info}">
                                Realice el SINPE Móvil al 8888-0000 a nombre de Farmacia Vida.
                            </div>

                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('metodoPago')}"
                                 th:errors="*{metodoPago}">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                            <a th:href="@{/carrito}"
                               class="btn btn-secondary"
                               th:text="#{comun.cancelar}">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-farmacia"
                                    th:text="#{factura.boton.generar}">
                                Generar factura
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

        <div class="col-lg-5">

            <section class="card h-100">

                <div class="card-body">

                    <h5 class="card-title mb-3"
                        th:text="#{factura.resumen.titulo}">
                        Resumen de la compra
                    </h5>

                    <div class="table-responsive">

                        <table class="table tabla-farmacia align-middle mb-0">

                            <thead>
                            <tr>
                                <th th:text="#{medicamento.columna.nombre}">Medicamento</th>
                                <th th:text="#{carrito.columna.cantidad}">Cantidad</th>
                                <th th:text="#{comun.campo.precio}">Precio</th>
                                <th th:text="#{carrito.columna.subtotal}">Subtotal</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="item : ${items}">

                                <td th:text="${item.nombre}"></td>

                                <td th:text="${item.cantidad}"></td>

                                <td>
                                    ₡<span th:text="${#numbers.formatDecimal(item.precio, 1, 2)}"></span>
                                </td>

                                <td>
                                    ₡<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                                </td>

                            </tr>

                            </tbody>

                            <tfoot>
                            <tr>
                                <td colspan="3"
                                    class="text-end fw-bold"
                                    th:text="#{factura.total}">
                                    Total
                                </td>
                                <td class="fw-bold">
                                    ₡<span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span>
                                </td>
                            </tr>
                            </tfoot>

                        </table>

                    </div>

                </div>

            </section>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/compra :: procesando}"></div>

<div th:replace="~{fragments/head :: bootstrap-js}"></div>
<script th:src="@{/js/cedula-mask.js}"></script>
<script th:src="@{/js/telefono-mask.js}"></script>
<script th:src="@{/js/compra-procesando.js}"></script>

</body>
</html>
