<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${cliente.id == null}
        ? #{cliente.form.titulo.pagina.nuevo}
        : #{cliente.form.titulo.pagina.editar}">
        Cliente
    </title>

    <link th:replace="~{fragments/head :: bootstrap-css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <section class="encabezado-pagina mb-4">

                <span class="insignia-proveedor mb-2"
                      th:text="${cliente.id == null}
                          ? #{comun.insignia.nuevo}
                          : #{comun.insignia.editar}">
                </span>

                <h1 th:text="${cliente.id == null}
                    ? #{cliente.form.titulo.nuevo}
                    : #{cliente.form.titulo.editar}">
                </h1>

                <p th:text="${cliente.id == null}
                    ? #{cliente.form.subtitulo.nuevo}
                    : #{cliente.form.subtitulo.editar}">
                </p>

            </section>

            <section class="card formulario-farmacia">

                <div class="card-body">

                    <form th:object="${cliente}"
                          th:action="${cliente.id == null}
                              ? @{/clientes}
                              : @{/clientes/{id}(id=${cliente.id})}"
                          method="post">

                        <div class="mb-4">

                            <label for="nombre"
                                   class="form-label"
                                   th:text="#{comun.campo.nombre.completo}">
                                Nombre completo
                            </label>

                            <input type="text"
                                   id="nombre"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                   th:field="*{nombre}"
                                   th:placeholder="#{cliente.campo.nombre.placeholder}">

                            <div class="invalid-feedback"
                                 th:errors="*{nombre}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="identificacion"
                                   class="form-label"
                                   th:text="#{cliente.campo.identificacion}">
                                Identificación
                            </label>

                            <input type="text"
                                   id="identificacion"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('identificacion')} ? 'is-invalid'"
                                   th:field="*{identificacion}"
                                   placeholder="Ejemplo: 1-1234-5678">

                            <div class="invalid-feedback"
                                 th:errors="*{identificacion}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="telefono"
                                   class="form-label"
                                   th:text="#{comun.campo.telefono}">
                                Teléfono
                            </label>

                            <input type="tel"
                                   id="telefono"
                                   class="form-control js-telefono"
                                   inputmode="numeric"
                                   autocomplete="tel-national"
                                   maxlength="9"
                                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                   th:field="*{telefono}"
                                   th:placeholder="#{cliente.campo.telefono.placeholder}">

                            <div class="invalid-feedback"
                                 th:errors="*{telefono}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="correo"
                                   class="form-label"
                                   th:text="#{comun.campo.correo}">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   id="correo"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                                   th:field="*{correo}"
                                   th:placeholder="#{cliente.campo.correo.placeholder}">

                            <div class="invalid-feedback"
                                 th:errors="*{correo}">
                            </div>

                        </div>

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                            <a th:href="@{/clientes}"
                               class="btn btn-secondary"
                               th:text="#{comun.volver}">
                                Volver
                            </a>

                            <button type="submit"
                                    class="btn btn-farmacia"
                                    th:text="${cliente.id == null}
                                        ? #{cliente.registrar}
                                        : #{comun.guardar.cambios}">
                                Guardar
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/head :: bootstrap-js}"></div>

<script th:src="@{/js/telefono-mask.js}"></script>

</body>
</html>
