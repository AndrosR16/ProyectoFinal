<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{registro.titulo.pagina}">Crear cuenta - Farmacia</title>

    <link th:replace="~{fragments/head :: bootstrap-css}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <section class="encabezado-pagina mb-4">

                    <span class="insignia-proveedor mb-2" th:text="#{registro.insignia}">
                        Nuevo registro
                    </span>

                    <h1 th:text="#{registro.crear.cuenta}">
                        Crear cuenta
                    </h1>

                    <p th:text="#{registro.subtitulo}">
                        Complete la información para registrar una nueva cuenta de acceso.
                    </p>

                </section>

                <section class="card formulario-farmacia">

                    <div class="card-body">

                        <form th:object="${registroForm}"
                              th:action="@{/registro}"
                              method="post">

                            <div class="mb-4">

                                <label for="username" class="form-label" th:text="#{comun.campo.usuario}">
                                    Usuario
                                </label>

                                <input type="text"
                                       id="username"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('username')}
                                           ? 'is-invalid'"
                                       th:field="*{username}"
                                       th:placeholder="#{registro.placeholder.usuario}"
                                       placeholder="Ingrese un nombre de usuario">

                                <div class="invalid-feedback"
                                     th:errors="*{username}">
                                </div>

                            </div>

                            <div class="mb-4">

                                <label for="nombre" class="form-label" th:text="#{comun.campo.nombre.completo}">
                                    Nombre completo
                                </label>

                                <input type="text"
                                       id="nombre"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')}
                                           ? 'is-invalid'"
                                       th:field="*{nombre}"
                                       th:placeholder="#{registro.placeholder.nombre}"
                                       placeholder="Ingrese su nombre completo">

                                <div class="invalid-feedback"
                                     th:errors="*{nombre}">
                                </div>

                            </div>

                            <div class="mb-4">

                                <label for="correo" class="form-label" th:text="#{comun.campo.correo}">
                                    Correo electrónico
                                </label>

                                <input type="email"
                                       id="correo"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('correo')}
                                           ? 'is-invalid'"
                                       th:field="*{correo}"
                                       th:placeholder="#{registro.placeholder.correo}"
                                       placeholder="Ejemplo: correo@dominio.com">

                                <div class="invalid-feedback"
                                     th:errors="*{correo}">
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-4">

                                    <label for="password" class="form-label" th:text="#{comun.campo.password}">
                                        Contraseña
                                    </label>

                                    <input type="password"
                                           id="password"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('password')}
                                               ? 'is-invalid'"
                                           th:field="*{password}"
                                           th:placeholder="#{registro.placeholder.password}"
                                           placeholder="Ingrese una contraseña">

                                    <div class="invalid-feedback"
                                         th:errors="*{password}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-4">

                                    <label for="confirmPassword" class="form-label" th:text="#{registro.campo.confirmar.password}">
                                        Confirmar contraseña
                                    </label>

                                    <input type="password"
                                           id="confirmPassword"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('confirmPassword')}
                                               ? 'is-invalid'"
                                           th:field="*{confirmPassword}"
                                           th:placeholder="#{registro.placeholder.confirmar.password}"
                                           placeholder="Repita la contraseña">

                                    <div class="invalid-feedback"
                                         th:errors="*{confirmPassword}">
                                    </div>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                                <a th:href="@{/login}"
                                   class="btn btn-secondary"
                                   th:text="#{registro.ya.tengo.cuenta}">
                                    Ya tengo una cuenta
                                </a>

                                <button type="submit"
                                        class="btn btn-farmacia"
                                        th:text="#{registro.crear.cuenta}">
                                    Crear cuenta
                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>

</html>
