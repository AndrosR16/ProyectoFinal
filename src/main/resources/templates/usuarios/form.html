<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{usuario.admin.form.titulo.pagina}">
        Nuevo usuario - Farmacia Vida
    </title>

    <link th:replace="~{fragments/head :: bootstrap-css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <section class="encabezado-pagina mb-4">

        <span class="insignia-proveedor mb-2"
              th:text="#{usuario.admin.form.insignia}">
            Gestión de usuarios
        </span>

        <h1 th:text="#{usuario.admin.form.titulo}">
            Registrar usuario
        </h1>

        <p th:text="#{usuario.admin.form.subtitulo}">
            Cree una cuenta de acceso y asigne el rol correspondiente.
        </p>

    </section>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <section class="card formulario-farmacia">

        <div class="card-body">

            <form th:object="${registroForm}"
                  th:action="@{/usuarios}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="row g-4">

                    <div class="col-md-6">

                        <label for="nombre"
                               class="form-label"
                               th:text="#{usuario.admin.form.nombre}">
                            Nombre completo
                        </label>

                        <input type="text"
                               id="nombre"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                               th:field="*{nombre}"
                               th:placeholder="#{usuario.admin.form.nombre.placeholder}"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{nombre}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="correo"
                               class="form-label"
                               th:text="#{usuario.admin.form.correo}">
                            Correo electrónico
                        </label>

                        <input type="email"
                               id="correo"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                               th:field="*{correo}"
                               th:placeholder="#{usuario.admin.form.correo.placeholder}"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{correo}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="username"
                               class="form-label"
                               th:text="#{usuario.admin.form.username}">
                            Nombre de usuario
                        </label>

                        <input type="text"
                               id="username"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               th:field="*{username}"
                               th:placeholder="#{usuario.admin.form.username.placeholder}"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{username}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="rol"
                               class="form-label"
                               th:text="#{usuario.admin.form.rol}">
                            Rol
                        </label>

                        <select id="rol"
                                name="rol"
                                class="form-select"
                                required>

                            <option value="EMPLEADO"
                                    th:selected="${rolSeleccionado == 'EMPLEADO'}"
                                    th:text="#{usuario.admin.form.empleado}">
                                Empleado
                            </option>

                            <option value="CLIENTE"
                                    th:selected="${rolSeleccionado == 'CLIENTE'}"
                                    th:text="#{usuario.admin.form.cliente}">
                                Cliente
                            </option>

                            <option value="ADMIN"
                                    th:selected="${rolSeleccionado == 'ADMIN'}"
                                    th:text="#{usuario.admin.form.admin}">
                                Administrador
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label for="password"
                               class="form-label"
                               th:text="#{usuario.admin.form.password}">
                            Contraseña
                        </label>

                        <input type="password"
                               id="password"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               th:field="*{password}"
                               th:placeholder="#{usuario.admin.form.password.placeholder}"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{password}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="confirmPassword"
                               class="form-label"
                               th:text="#{usuario.admin.form.confirmar}">
                            Confirmar contraseña
                        </label>

                        <input type="password"
                               id="confirmPassword"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               th:field="*{confirmPassword}"
                               th:placeholder="#{usuario.admin.form.confirmar.placeholder}"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{confirmPassword}">
                        </div>

                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4">

                    <a th:href="@{/usuarios}"
                       class="btn btn-secondary"
                       th:text="#{usuario.admin.form.cancelar}">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-farmacia"
                            th:text="#{usuario.admin.form.registrar}">
                        Registrar usuario
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>

</html>
