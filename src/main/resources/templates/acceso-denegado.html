<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{error.acceso.denegado.titulo}">Acceso denegado</title>

    <link th:replace="~{fragments/head :: bootstrap-css}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <section class="encabezado-pagina text-center">

                    <h1 th:text="#{error.acceso.denegado.titulo}">Acceso denegado</h1>

                    <p class="mb-4"
                       th:text="#{error.acceso.denegado.mensaje}">
                        Su usuario no tiene permiso para ingresar a este módulo.
                    </p>

                    <a th:href="@{/shop}"
                       class="btn btn-farmacia"
                       th:text="#{shop.titulo}">
                        Tienda
                    </a>

                </section>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>

</html>
