<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${proveedor.id == null}
        ? #{proveedor.form.titulo.pagina.nuevo}
        : #{proveedor.form.titulo.pagina.editar}">
        Proveedor
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <section class="encabezado-pagina mb-4">

                    <span class="insignia-proveedor mb-2" th:text="${proveedor.id == null}
                              ? #{comun.insignia.nuevo}
                              : #{comun.insignia.editar}">
                    </span>

                    <h1 th:text="${proveedor.id == null}
                        ? #{proveedor.form.titulo.nuevo}
                        : #{proveedor.form.titulo.editar}">
                    </h1>

                    <p th:text="${proveedor.id == null}
                        ? #{proveedor.form.subtitulo.nuevo}
                        : #{proveedor.form.subtitulo.editar}">
                    </p>

                </section>

                <section class="card formulario-farmacia">

                    <div class="card-body">

                        <form th:object="${proveedor}" th:action="${proveedor.id == null}
          ? @{/proveedores}
          : @{/proveedores/{id}(id=${proveedor.id})}" method="post">

                            <input type="hidden" th:field="*{id}">

                            <div class="mb-4">

                                <label for="nombre" class="form-label" th:text="#{proveedor.campo.nombre}">
                                    Nombre del proveedor
                                </label>

                                <input type="text" id="nombre" class="form-control" th:classappend="${#fields.hasErrors('nombre')}
                                           ? 'is-invalid'" th:field="*{nombre}"
                                    placeholder="Ejemplo: Distribuidora Médica CR"
                                    th:placeholder="#{proveedor.campo.nombre.placeholder}">

                                <div class="invalid-feedback" th:errors="*{nombre}">
                                </div>

                                <div class="form-text" th:text="#{proveedor.campo.nombre.ayuda}">
                                    Ingrese el nombre comercial o razón social.
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-4">

                                    <label for="telefono" class="form-label" th:text="#{comun.campo.telefono}">
                                        Teléfono
                                    </label>

                                    <input type="tel"
                                           id="telefono"
                                           class="form-control js-telefono"
                                           inputmode="numeric"
                                           autocomplete="tel-national"
                                           maxlength="9"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
                                           th:field="*{telefono}"
                                           th:placeholder="#{proveedor.campo.telefono.placeholder}">

                                    <div class="invalid-feedback" th:errors="*{telefono}">
                                    </div>

                                    <div class="form-text" th:text="#{proveedor.campo.telefono.ayuda}">
                                        Número de contacto del proveedor.
                                    </div>

                                </div>

                                <div class="col-md-6 mb-4">

                                    <label for="correo" class="form-label" th:text="#{comun.campo.correo}">
                                        Correo electrónico
                                    </label>

                                    <input type="email" id="correo" class="form-control" th:classappend="${#fields.hasErrors('correo')}
                                               ? 'is-invalid'" th:field="*{correo}"
                                        placeholder="Ejemplo: ventas@proveedor.com"
                                        th:placeholder="#{proveedor.campo.correo.placeholder}">

                                    <div class="invalid-feedback" th:errors="*{correo}">
                                    </div>

                                    <div class="form-text" th:text="#{proveedor.campo.correo.ayuda}">
                                        Correo utilizado para pedidos y comunicación.
                                    </div>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                                <a th:href="@{/proveedores}" class="btn btn-secondary" th:text="#{comun.volver}">
                                    Volver
                                </a>

                                <button type="submit" class="btn btn-farmacia" th:text="${proveedor.id == null}
                                            ? #{proveedor.registrar}
                                            : #{comun.guardar.cambios}">
                                    Guardar
                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/telefono-mask.js}"></script>

</body>

</html>
