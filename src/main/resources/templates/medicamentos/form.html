<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${medicamento.id == null}
        ? #{medicamento.form.titulo.pagina.nuevo}
        : #{medicamento.form.titulo.pagina.editar}">
        Medicamento
    </title>

    <link th:replace="~{fragments/head :: bootstrap-css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <section class="encabezado-pagina mb-4">

                    <span class="insignia-proveedor mb-2"
                          th:text="${medicamento.id == null}
                              ? #{comun.insignia.nuevo}
                              : #{comun.insignia.editar}">
                    </span>

                    <h1 th:text="${medicamento.id == null}
                        ? #{medicamento.form.titulo.nuevo}
                        : #{medicamento.form.titulo.editar}">
                    </h1>

                    <p th:text="${medicamento.id == null}
                        ? #{medicamento.form.subtitulo.nuevo}
                        : #{medicamento.form.subtitulo.editar}">
                    </p>

                </section>

                <section class="card formulario-farmacia">

                    <div class="card-body">

                        <form th:object="${medicamento}"
                              th:action="${medicamento.id == null}
                                  ? @{/medicamentos}
                                  : @{/medicamentos/{id}(id=${medicamento.id})}"
                              method="post">

                            <div class="mb-4">

                                <label for="nombre" class="form-label"
                                       th:text="#{medicamento.campo.nombre}">
                                    Nombre del medicamento
                                </label>

                                <input type="text"
                                       id="nombre"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')}
                                           ? 'is-invalid'"
                                       th:field="*{nombre}"
                                       th:placeholder="#{medicamento.campo.nombre.placeholder}"
                                       placeholder="Ejemplo: Acetaminofén">

                                <div class="invalid-feedback"
                                     th:errors="*{nombre}">
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-4">

                                    <label for="precio" class="form-label"
                                           th:text="#{comun.campo.precio}">
                                        Precio
                                    </label>

                                    <input type="number"
                                           id="precio"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('precio')}
                                               ? 'is-invalid'"
                                           th:field="*{precio}"
                                           min="0"
                                           step="0.01"
                                           th:placeholder="#{medicamento.campo.precio.placeholder}"
                                           placeholder="Ejemplo: 2500.00">

                                    <div class="invalid-feedback"
                                         th:errors="*{precio}">
                                    </div>

                                </div>

                                <div class="col-md-6 mb-4">

                                    <label for="stock" class="form-label"
                                           th:text="#{medicamento.campo.stock}">
                                        Cantidad en inventario
                                    </label>

                                    <input type="number"
                                           id="stock"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('stock')}
                                               ? 'is-invalid'"
                                           th:field="*{stock}"
                                           min="0"
                                           th:placeholder="#{medicamento.campo.stock.placeholder}"
                                           placeholder="Ejemplo: 25">

                                    <div class="invalid-feedback"
                                         th:errors="*{stock}">
                                    </div>

                                </div>

                            </div>

                            <div class="mb-4 form-check">

                                <input type="checkbox"
                                       id="destacado"
                                       class="form-check-input"
                                       th:field="*{destacado}">

                                <label for="destacado" class="form-check-label"
                                       th:text="#{medicamento.destacado}">
                                    Producto destacado
                                </label>

                                <div class="form-text"
                                     th:text="#{medicamento.destacado.ayuda}">
                                    Aparecerá en la sección de destacados de la tienda.
                                </div>

                            </div>

                            <div class="mb-4">

                                <label for="imagenUrl" class="form-label"
                                       th:text="#{medicamento.imagen}">
                                    URL de imagen
                                </label>

                                <input type="url"
                                       id="imagenUrl"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('imagenUrl')}
                                           ? 'is-invalid'"
                                       th:field="*{imagenUrl}">

                                <div class="invalid-feedback"
                                     th:errors="*{imagenUrl}">
                                </div>

                                <div class="form-text"
                                     th:text="#{medicamento.imagen.ayuda}">
                                    Enlace a una foto del producto (opcional). Si se deja vacío se muestra un ícono.
                                </div>

                            </div>

                            <div class="mb-4">

                                <label for="descripcion" class="form-label"
                                       th:text="#{medicamento.descripcion}">
                                    Descripción
                                </label>

                                <textarea id="descripcion"
                                          class="form-control"
                                          th:classappend="${#fields.hasErrors('descripcion')}
                                              ? 'is-invalid'"
                                          th:field="*{descripcion}"
                                          rows="3"></textarea>

                                <div class="invalid-feedback"
                                     th:errors="*{descripcion}">
                                </div>

                                <div class="form-text"
                                     th:text="#{medicamento.descripcion.ayuda}">
                                    Breve descripción del producto que se muestra en la tienda (opcional).
                                </div>

                            </div>

                            <div class="mb-4">

                                <label for="proveedorId" class="form-label"
                                       th:text="#{medicamento.proveedor}">
                                    Proveedor
                                </label>

                                <select id="proveedorId" name="proveedorId"
                                        class="form-select" required>
                                    <option value=""
                                            th:text="#{medicamento.proveedor.seleccione}">
                                        Seleccione un proveedor
                                    </option>
                                    <option th:each="p : ${proveedores}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}"
                                            th:selected="${medicamento.proveedor != null
                                                and medicamento.proveedor.id == p.id}">
                                        Proveedor
                                    </option>
                                </select>

                            </div>

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                                <a th:href="@{/medicamentos}"
                                   class="btn btn-secondary"
                                   th:text="#{comun.volver}">
                                    Volver
                                </a>

                                <button type="submit"
                                        class="btn btn-farmacia"
                                        th:text="${medicamento.id == null}
                                            ? #{medicamento.registrar}
                                            : #{comun.guardar.cambios}">
                                    Guardar
                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>

</html>
