<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{error.generico.titulo.pagina}">Ocurrió un error</title>

    <link th:replace="~{fragments/head :: bootstrap-css}">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <section class="encabezado-pagina text-center">

                    <h1 th:text="#{error.generico.titulo}">Ocurrió un error inesperado</h1>

                    <p class="mb-2 text-muted small"
                       th:if="${status}"
                       th:text="#{error.generico.codigo(${status})}">
                    </p>

                    <p class="mb-4"
                       th:text="#{error.generico.mensaje}">
                        Intentá de nuevo más tarde. Si el problema persiste, contactá al administrador.
                    </p>

                    <a th:href="@{/}"
                       class="btn btn-farmacia"
                       th:text="#{comun.volver.inicio}">
                        Volver al inicio
                    </a>

                </section>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/head :: bootstrap-js}"></div>

</body>

</html>
