# =====================================================================
# Message catalog - ENGLISH (root bundle / default fallback)
# =====================================================================
# Bundle layout: messages.properties (this file) is the ROOT bundle,
# resolved whenever no locale-specific file matches (e.g. an
# unsupported "lang" value) - this is why it is English rather than
# Spanish. The SITE's default locale is still Spanish: LocaleConfig
# sets Locale.of("es") as the default on CookieLocaleResolver, so a
# fresh visitor without a "lang" cookie gets messages_es.properties.
# English only becomes visible when the user explicitly switches
# (LocaleChangeInterceptor, ?lang=en) or when an unrecognised locale
# falls back to the bundle root. See LocaleConfig.java.
#
# Key convention: keys stay in Spanish (<seccion>.<...>, lowercase,
# dot separator) in every locale file - only the values are
# translated. Keep this file's key order identical to
# messages_es.properties so the two are easy to diff.
#
# Cross-section reuse (see messages_es.properties for the full note):
# nav.html reuses medicamento.titulo / cliente.titulo /
# proveedor.titulo; dashboard.html reuses nav.inventario /
# nav.facturas; shared UI chrome lives under comun.*.
# =====================================================================

