# =====================================================================
# Catalogo de mensajes - ESPANOL (locale explicito "es")
# =====================================================================
# Estructura de bundles: messages.properties = ingles (bundle raiz/
# fallback por defecto de Spring), messages_es.properties = espanol
# (este archivo, locale explicito). El espanol es el idioma por
# defecto DEL SITIO (LocaleConfig fija Locale.of("es") como default de
# CookieLocaleResolver), pero el bundle raiz de Spring sigue siendo el
# ingles: si un locale no soportado llega igual resuelve a texto en
# ingles, nunca a claves sin traducir. Ver LocaleConfig.java.
#
# Convencion de claves: <seccion>.<...>, todo en espanol, minusculas,
# separador punto. Un mismo valor reutilizado entre pantallas usa UNA
# sola clave (ver notas "reuso" mas abajo) para no duplicar texto.
#
# Reusos entre secciones (para quien migre templates):
#   - nav.html debe usar medicamento.titulo / cliente.titulo /
#     proveedor.titulo para los enlaces "Medicamentos"/"Clientes"/
#     "Proveedores" (son el mismo texto que en dashboard y en el <h1>
#     de cada listado).
#   - dashboard.html reusa nav.inventario y nav.facturas para los
#     <h3> de esas tarjetas (texto identico).
#   - Los textos genericos de UI (Editar, Eliminar, Cancelar, Volver,
#     ID, Acciones, campos de formulario compartidos, etc.) viven en
#     comun.* y se reusan desde todos los modulos CRUD.
# =====================================================================

